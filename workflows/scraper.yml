name: All India Lead Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Lead Scraper
      run: |
        python main.py

    - name: Upload Scraped CSV Data as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Scraped-Leads-CSV
        path: All_India_Master_Leads_Backup.csv
